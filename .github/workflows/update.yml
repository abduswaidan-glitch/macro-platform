name: تحديث بيانات الاقتصاد الكلي

on:
  schedule:
    # كل يوم عمل: حول الافتتاح (تقرير Claude بعد 8:30 بتوقيت نيويورك، صيفاً وشتاءً)، ثم منتصف اليوم وبعد الإغلاق.
    # جدولة GitHub قد تتأخر أو تُسقط بعض التشغيلات، لذلك المواعيد متعددة.
    - cron: "7,37 12,13,14 * * 1-5"
    - cron: "17 17,21 * * 1-5"
  workflow_dispatch:
    inputs:
      ai_force:
        description: "اكتب تقرير Claude الآن (true / false)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt anthropic curl_cffi

      - name: جلب البيانات وكتابة data.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_FORCE: ${{ github.event.inputs.ai_force }}
        run: python fetch_macro.py

      - name: حفظ التحديث
        run: |
          git config user.name "macro-data-bot"
          git config user.email "macro-data-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -qm "تحديث بيانات الاقتصاد الكلي $(date -u +%F)"
          for i in 1 2 3; do
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; break; }
          done
          echo "push failed"; exit 1

      - name: بناء الموقع بأحدث كود (مع آخر أخبار منشورة)
        run: |
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          python fetch_macro.py --offline
          python fetch_news.py --site _site --no-fetch

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-update-${{ github.run_id }}

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-update-${{ github.run_id }}

      - name: توقيت التقرير (بدء، اكتمال، نشر)
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          from datetime import datetime, timezone
          h = json.load(open("data/ai_history.json", encoding="utf-8")) if os.path.exists("data/ai_history.json") else []
          m = h[0]["meta"] if h else {}
          if m.get("run_id") == os.environ["GITHUB_RUN_ID"]:
              print(f"report {m['ny_date']}: started {m.get('started_at')}, completed {m.get('completed_at')}, "
                    f"published {datetime.now(timezone.utc):%Y-%m-%dT%H:%M:%SZ} (trigger {m.get('trigger')})")
          else:
              print("no report written in this run")
          PY
