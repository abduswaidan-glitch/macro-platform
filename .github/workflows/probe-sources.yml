name: فحص مؤقت لمصادر الأخبار والتقويم (طلب دمج فقط، يُحذف قبل الدمج)

# مؤقت: يشغّل كود الجلب الجديد نفسه على المصادر الحقيقية من خوادم GitHub، ويطبع ما يُبقيه المرشّح وما يُسقطه.
# للقراءة فقط: بلا أسرار ولا نشر ولا كتابة.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: المصادر الحقيقية عبر macro_platform.news
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from macro_platform import news
          now = datetime.now(timezone.utc)
          since = news.keep_since(now)
          print("now", news._iso(now), "keep_since", news._iso(since))
          for src in news.DEFAULT_SOURCES:
              try:
                  raw = news.http_get(src["url"])
                  rows = news.parse_rss(raw)
                  items, st = news.fetch_source(src, now, since, get=lambda u, raw=raw: raw)
                  kept = {i["title_en"]: i for i in items}
                  print(f"== {src['name']} {src['url'][-45:]} seen={st['seen']} kept={st['kept']}")
                  for r in rows:
                      t = news._rss_time(r["pub"])
                      i = kept.get(r["title"])
                      mark = f"KEEP L{i['level']} {'US' if i['us'] else '--'}" if i else ("old        " if t and t < since else "drop       ")
                      print(f"  {mark} {news._iso(t) if t else '?':20} {r['title'][:120]}")
              except Exception as e:
                  print(f"== {src['name']} {src['url'][-45:]} FAILED {type(e).__name__}: {e}")
          try:
              events, window, status = news.fetch_calendar(news.DEFAULT_CALENDAR)
              print("== calendar", [(s["name"], s["ok"], s.get("error"), s.get("seen"), s.get("kept")) for s in status])
              print("   window", [news._iso(w) for w in window] if window else None)
              for e in sorted(events, key=lambda e: e["timeUtc"]):
                  print(f"  {e['timeUtc']} impact={e['impact']} {news.event_status(e, now):24} {e['title']} | f={e['forecast']} p={e['previous']} a={e['actual']}")
          except Exception as e:
              print("== calendar FAILED", type(e).__name__, e)
          PY
      - name: دورة أخبار كاملة (fetch_news.py) بلا news.json سابق وبلا مفاتيح
        run: |
          pip install -q -r requirements.txt
          python fetch_news.py --site _probe --seed-url ''
          python3 - <<'PY'
          import json
          d = json.load(open("_probe/news.json", encoding="utf-8"))
          print("source:", d["source"])
          print("errors:", d["errors"])
          print("last_success_utc:", d["last_success_utc"], "keep_since_utc:", d["keep_since_utc"])
          print("items:", len(d["items"]), "us:", sum(i["us"] for i in d["items"]), "level3:", sum(i["level"] >= 3 for i in d["items"]))
          print("calendar:", len(d["calendar"]))
          for f in d["feeds"]:
              print("  feed", f["name"], f["ok"], f.get("error"), f.get("seen"), f.get("kept"))
          print("bytes:", len(json.dumps(d, ensure_ascii=False)))
          PY
