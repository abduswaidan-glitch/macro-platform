name: نشر الصفحة بعد كل تعديل

# أي دفع إلى main (تعديل كود أو صفحة) يُنشر خلال دقيقة: يُعاد بناء data.json من data/raw بأحدث كود،
# مع آخر أخبار منشورة، بلا جلب من FRED ولا تقرير. دفعات البوت (GITHUB_TOKEN) لا تشغّل هذا الملف.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-on-push
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: الاختبارات
        run: python -m pytest -q tests

      - name: بناء الموقع بأحدث كود
        run: |
          python fetch_macro.py --offline
          python fetch_news.py --site _site --no-fetch

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-push-${{ github.run_id }}

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-push-${{ github.run_id }}
